<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Ulang Tahun</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:20px; background:#fefefe;}
    h1{text-align:center;}
    .form-group{margin-bottom:15px;}
    label{display:block;margin-bottom:5px;}
    input,textarea,button{width:100%;padding:10px;box-sizing:border-box;}
    button{background:#ff69b4;border:none;color:white;font-size:16px;border-radius:8px;}
    #preview{max-width:100%;margin-top:10px;display:none;border-radius:8px;}
    .card-page{text-align:center;padding:20px;}
    .balloon{width:50px;height:70px;background:pink;border-radius:50% 50% 50% 50%;display:inline-block;margin:5px;position:relative;cursor:pointer;}
    .balloon::after{content:'';position:absolute;bottom:-10px;left:50%;width:2px;height:10px;background:#333;}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;}
    .modal-content{background:#fff;padding:20px;border-radius:10px;max-width:90%;}
  </style>
</head>
<body>
<div id="editPage">
  <h1>Custom Kartu Ulang Tahun</h1>
  <div class="form-group">
    <label>Foto:</label>
    <input type="file" id="foto" accept="image/*">
    <img id="preview">
  </div>
  <div class="form-group">
    <label>Nama:</label>
    <input type="text" id="nama">
  </div>
  <div class="form-group">
    <label>Umur:</label>
    <input type="number" id="umur">
  </div>
  <div class="form-group">
    <label>Ucapan:</label>
    <textarea id="ucapan"></textarea>
  </div>
  <button id="saveShare">Save & Share</button>
</div>

<div id="cardPage" style="display:none;">
  <div class="card-page">
    <h1 id="cardTitle"></h1>
    <div id="balloons"></div>
    <img id="cardFoto" style="max-width:100%;border-radius:10px;display:none;margin:10px auto;">
    <div id="cardUcapan" style="margin-top:20px;font-size:18px;"></div>
    <div id="emoji" style="font-size:40px;cursor:pointer;display:none;">🗿</div>
    <div id="game" style="display:none;margin-top:20px;">
      <h3>Pilih salah satu kartu doa:</h3>
      <div>
        <button class="cardChoice">Semoga tambah pintar dan kritis</button>
        <button class="cardChoice">Semoga tambah kaya dan sukses</button>
        <button class="cardChoice">Semoga tambah rajin</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
// Foto preview + simpan
const fotoInput = document.getElementById('foto');
const preview = document.getElementById('preview');

fotoInput.addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(evt){
      preview.src = evt.target.result;
      preview.style.display = 'block';
      localStorage.setItem('foto', evt.target.result);
    }
    reader.readAsDataURL(file);
  }
});

// Restore form saat reload
window.addEventListener('DOMContentLoaded', ()=>{
  const saved = localStorage.getItem('cardData');
  if(saved){
    const data = JSON.parse(saved);
    if(data.nama) document.getElementById('nama').value = data.nama;
    if(data.umur) document.getElementById('umur').value = data.umur;
    if(data.ucapan) document.getElementById('ucapan').value = data.ucapan;
    if(data.foto){
      preview.src = data.foto;
      preview.style.display = 'block';
    }
  }
});

// Save & Share
const saveBtn = document.getElementById('saveShare');
saveBtn.addEventListener('click', ()=>{
  const nama = document.getElementById('nama').value;
  const umur = document.getElementById('umur').value;
  const ucapan = document.getElementById('ucapan').value;
  const foto = localStorage.getItem('foto') || '';

  const data = {nama, umur, ucapan, foto};
  localStorage.setItem('cardData', JSON.stringify(data));

  const encoded = btoa(JSON.stringify(data));
  const link = `${window.location.origin}${window.location.pathname}#/card/${encoded}`;

  if(navigator.share){
    navigator.share({title:"Kartu Ulang Tahun", url: link});
  } else {
    prompt("Copy link ini:", link);
  }
});

// Halaman kartu
function showCard(data){
  document.getElementById('editPage').style.display='none';
  document.getElementById('cardPage').style.display='block';
  document.getElementById('cardTitle').innerText = `Selamat Ulang Tahun ${data.nama}!`;

  // Balon
  const balloons = document.getElementById('balloons');
  balloons.innerHTML='';
  for(let i=0;i<data.umur;i++){
    const b=document.createElement('div');
    b.className='balloon';
    b.addEventListener('click',()=>{
      b.style.visibility='hidden';
      if([...balloons.children].every(x=>x.style.visibility==='hidden')){
        alert('🎉 Semua balon sudah meletus!');
        if(data.foto){
          document.getElementById('cardFoto').src=data.foto;
          document.getElementById('cardFoto').style.display='block';
        }
      }
    });
    balloons.appendChild(b);
  }

  // Foto klik → ucapan → emoji
  const fotoEl = document.getElementById('cardFoto');
  const ucapanEl = document.getElementById('cardUcapan');
  const emoji = document.getElementById('emoji');
  let step=0;
  fotoEl.onclick=()=>{
    if(step===0){
      ucapanEl.innerText = data.ucapan;
      step=1;
    } else if(step===1){
      emoji.style.display='block';
      step=2;
    }
  }

  emoji.onclick=()=>{
    document.getElementById('game').style.display='block';
    emoji.style.display='none';
  }

  // Game kartu doa
  document.querySelectorAll('.cardChoice').forEach(btn=>{
    btn.onclick=()=>{
      showModal(btn.innerText+" ✨");
    }
  });
}

// Modal
function showModal(msg){
  const modal=document.getElementById('modal');
  const content=document.getElementById('modalContent');
  content.innerText=msg+"\nBye Bye";
  modal.style.display='flex';
  modal.onclick=()=>{modal.style.display='none';}
}

// Routing hash
if(window.location.hash.startsWith('#/card/')){
  try{
    const encoded=window.location.hash.replace('#/card/','');
    const data=JSON.parse(atob(encoded));
    showCard(data);
  }catch(e){
    console.error(e);
  }
}
</script>
</body>
</html>
